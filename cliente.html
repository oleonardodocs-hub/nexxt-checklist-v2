<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cliente · Gestão de Mídias Sociais</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell app-shell-largo">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <img src="assets/logo.png" alt="" style="height:28px;" />
        <div>
          <a class="breadcrumb" href="dashboard.html">&larr; Painel</a>
          <h1 id="client-title">Carregando...</h1>
          <div id="client-color-swatches"></div>
        </div>
      </div>
      <div class="user-tag" id="user-tag">Carregando...</div>
    </div>

    <div class="cliente-layout">
      <div class="cliente-coluna-principal">
        <div id="week-tabs" class="week-tabs"></div>
        <div id="week-banner" class="week-banner" style="display:none;"></div>

        <div id="acessos-section"></div>

        <div id="previa-semana" class="previa-semana"></div>

        <div id="block-grid" class="block-grid">
          <div class="empty-state">Carregando...</div>
        </div>

        <div class="tarefas-diarias-section" id="tarefas-diarias-section">
          <div class="tarefas-diarias-topo">
            <h2 class="tarefas-diarias-titulo">Tarefas diárias</h2>
            <button type="button" class="btn btn-primary" id="btn-nova-tarefa-diaria">+ Nova tarefa diária</button>
          </div>
          <div class="add-form-recorrente" id="form-nova-tarefa-diaria"></div>
          <div id="tarefas-diarias-dias" class="tarefas-diarias-dias"></div>
        </div>
      </div>

      <aside class="cliente-sidebar" id="cliente-sidebar">
        <div class="empty-state">Carregando...</div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <script src="js/config.js"></script>
  <script src="js/githubClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/paleta.js"></script>
  <script src="js/modalTarefa.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
