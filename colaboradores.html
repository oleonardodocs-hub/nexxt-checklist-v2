<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipe · Gestão de Mídias Sociais</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <img src="assets/logo.png" alt="" style="height:28px;" />
        <div>
          <a class="breadcrumb" href="dashboard.html">&larr; Painel</a>
          <h1>Equipe</h1>
        </div>
      </div>
      <div class="user-tag" id="user-tag">Carregando...</div>
    </div>

    <p style="font-size:13px; color:var(--text-secondary); max-width:560px;">
      Cadastre aqui os colaboradores da equipe. Eles aparecem como opção de
      "Responsável" em cada tarefa, nos cards dos clientes.
    </p>

    <div class="add-form open" style="margin-top:16px;">
      <div class="grid-2">
        <div class="field">
          <label for="novo-nome">Nome</label>
          <input type="text" id="novo-nome" placeholder="Ex: Mariana" />
        </div>
        <div class="field">
          <label for="nova-funcao">Função</label>
          <input type="text" id="nova-funcao" placeholder="Ex: Social Media" />
        </div>
      </div>
      <button class="btn btn-primary" id="btn-salvar-colaborador">Adicionar colaborador</button>
      <p class="form-msg" id="msg-add-colaborador"></p>
    </div>

    <div class="section-title">Colaboradores cadastrados</div>
    <div id="lista-colaboradores">
      <div class="empty-state">Carregando...</div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <script src="js/config.js"></script>
  <script src="js/githubClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/colaboradores.js"></script>
</body>
</html>
